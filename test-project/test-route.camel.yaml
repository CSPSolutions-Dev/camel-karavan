- route:
    id: route-53e9
    nodePrefixId: route-13c
    from:
      id: from-89ce
      uri: timer
      parameters:
        timerName: DefaultTimer
        repeatCount: "3"
      steps:
        - log:
            id: log-4272
            message: Starting REST API poll attempt
        - to:
            id: to-d3e9
            uri: https
            parameters:
              httpMethod: GET
              httpUri: >-
                https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41
        - log:
            id: log-4273
            message: "Response body: ${body}"
        - to:
            id: to-b543
            uri: file
            parameters:
              directoryName: WeatherFiles
              fileName: response-${date:now:yyyyMMdd-HHmmss}
        - log:
            id: log-4274
            message: File written successfully
